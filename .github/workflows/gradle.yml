name: Build T-UI Expert X APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build installable Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # The project uses Gradle 6.1.1 and Android Gradle Plugin 4.0.0-alpha09.
      # Gradle 6.1.1 cannot run on JDK 17; use a compatible JDK 8 runtime.
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-27" "build-tools;28.0.3"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build F-Droid debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleFdroidDebug

      - name: Verify APK was generated
        id: apk
        shell: bash
        run: |
          APK_PATH="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "No APK file found under app/build/outputs/apk"
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Generated APK: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: T-UI-Expert-X-debug-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
